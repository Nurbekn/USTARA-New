name: USTARA v66 isolated verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/verify-frontend.mjs'
      - '.github/workflows/v66-verification.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/verify-frontend.mjs frontend/dist
        env:
          PUBLIC_BASE_PATH: /USTARA-New/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ustara_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ustara_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ustara_test -d ustara_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://ustara_test:ci-only-password@127.0.0.1:5432/ustara_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node --check server.js && node --check db.js
        working-directory: backend
      - run: node scripts/verify-postgres.cjs
